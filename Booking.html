<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Book Appointment</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
  font-family: 'Arial', sans-serif;
  background: #f9f9f9;
  padding: 40px;
}

.booking-form {
  background: white;
  padding: 30px;
  border-radius: 10px;
  max-width: 500px;
  margin: auto;
}

input {
  display: block;
  width: 100%;
  margin-bottom: 15px;
  padding: 10px;
}

#slotsContainer {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

.slot-btn {
  padding: 10px 15px;
  background: #eee;
  border: 1px solid #ccc;
  border-radius: 5px;
  cursor: pointer;
}

.slot-btn.selected {
  background: #007bff;
  color: white;
}

#submitBtn {
  background: #28a745;
  color: white;
  padding: 12px;
  border: none;
  width: 100%;
  font-size: 16px;
  border-radius: 5px;
  cursor: pointer;
}

#confirmationMessage {
  text-align: center;
  font-size: 18px;
  margin-top: 20px;
}

  </style>
</head>
<body>

  <div class="booking-form">
    <h1>Book a Meeting</h1>
    <form id="appointmentForm">
      <input type="text" id="name" placeholder="Your Name" required />
      <input type="email" id="email" placeholder="Your Email" required />

      <div id="slotsContainer">
        <!-- Time slots will be dynamically generated here -->
      </div>

      <button type="submit" id="submitBtn">Book Appointment</button>
    </form>

    <div id="confirmationMessage" style="display:none;">
      🎉 Your meeting is booked!<br>
      Check your email for confirmation.
    </div>
  </div>

  <script>const webAppUrl = 'https://script.google.com/macros/s/AKfycbw-5NvpEnbwqXzkJwjBlW3s8UENjN0eRjLThbN91q3nyqcGiTyTRjUKy1PoOQK8uOI/exec'; // CHANGE THIS!

    async function loadSlots() {
      const response = await fetch(webAppUrl);
      const bookedSlots = await response.json();
      
      generateSlots(bookedSlots);
    }
    
    function generateSlots(booked) {
      const container = document.getElementById('slotsContainer');
      const startHour = 6; // 6:00 AM
      const endHour = 22; // 10:00 PM
      const intervalMinutes = 45;
    
      for (let minutes = startHour * 60; minutes < endHour * 60; minutes += intervalMinutes) {
        const hrs = Math.floor(minutes / 60);
        const mins = minutes % 60;
        const slotTime = `${pad(hrs)}:${pad(mins)}`;
    
        if (!booked.includes(slotTime)) {
          const button = document.createElement('button');
          button.type = 'button';
          button.textContent = slotTime;
          button.className = 'slot-btn';
          button.onclick = () => selectSlot(slotTime);
          container.appendChild(button);
        }
      }
    }
    
    function selectSlot(time) {
      const selected = document.querySelector('.slot-btn.selected');
      if (selected) selected.classList.remove('selected');
    
      const buttons = document.querySelectorAll('.slot-btn');
      buttons.forEach(btn => {
        if (btn.textContent === time) btn.classList.add('selected');
      });
    
      document.getElementById('appointmentForm').dataset.slot = time;
    }
    
    document.getElementById('appointmentForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const slot = e.target.dataset.slot;
    
      if (!slot) {
        alert('Please select a time slot');
        return;
      }
    
      await fetch(webAppUrl, {
        method: 'POST',
        body: JSON.stringify({ name, email, slot }),
        headers: { 'Content-Type': 'application/json' }
      });
    
      document.getElementById('appointmentForm').reset();
      document.getElementById('slotsContainer').innerHTML = '';
      document.getElementById('confirmationMessage').style.display = 'block';
    });
    
    function pad(num) {
      return num.toString().padStart(2, '0');
    }
    
    loadSlots();
    </script>

</body>
</html>
