<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact Form</title>

  <!-- Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
  <div class="container mt-5">
    <h2 class="mb-4 text-center">Contact Us</h2>

    <form id="contactForm" class="p-4 border rounded shadow-sm bg-light">
      <div class="mb-3">
        <label for="name" class="form-label">Name*</label>
        <input type="text" class="form-control" id="name" name="name" placeholder="Enter your name" required>
      </div>

      <div class="mb-3">
        <label for="email" class="form-label">Email*</label>
        <input type="email" class="form-control" id="email" name="email" placeholder="Enter your email" required>
      </div>

      <div class="mb-3">
        <label for="message" class="form-label">Message</label>
        <textarea class="form-control" id="message" name="message" rows="4" placeholder="Type your message here..."></textarea>
      </div>

      <button type="submit" class="btn btn-primary w-100">Submit</button>
    </form>

    <div id="alertBox" class="alert mt-4 d-none" role="alert"></div>
  </div>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    const form = document.getElementById('contactForm');
    const alertBox = document.getElementById('alertBox');

    form.addEventListener('submit', e => {
      e.preventDefault();

      fetch('https://script.google.com/macros/s/AKfycbzWbNHfXfmKhKsb4fkhiIC6CZp2xqFO06D325FGcH4gErIT4CTvRguZg5QUvI7p4VY/exec', {
        method: 'POST',
        body: JSON.stringify({
          name: form.name.value,
          email: form.email.value,
          message: form.message.value
        }),
        headers: {
          'Content-Type': 'application/json'
        }
      })
      .then(res => res.text())
      .then(msg => {
        alertBox.classList.remove('d-none', 'alert-danger');
        alertBox.classList.add('alert-success');
        alertBox.innerText = "Thank you! Your message has been sent.";

        form.reset(); // Clear the form
      })
      .catch(err => {
        alertBox.classList.remove('d-none', 'alert-success');
        alertBox.classList.add('alert-danger');
        alertBox.innerText = "Oops! Something went wrong. Please try again.";
      });
    });
  </script>
</body>
</html>
